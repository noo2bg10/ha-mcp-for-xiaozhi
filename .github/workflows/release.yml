name: Upload ZIP to Release

on:
  release:
    types: [created]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate tag format
        run: |
          if [[ ! "$GITHUB_REF" =~ ^refs/tags/v[0-9]+\.[0-9]+\.[0-9]+.*$ ]]; then
            echo "Error: tag must look like v1.0.0"
            exit 1
          fi

      - name: Set manifest version from tag
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          sed -i "s/\"version\": \".*\"/\"version\": \"$VERSION\"/" custom_components/ws_mcp_server/manifest.json
          cat custom_components/ws_mcp_server/manifest.json

      - name: Create ZIP
        run: |
          cd custom_components/ws_mcp_server
          zip -r ../../ha-mcp-for-xiaozhi.zip . -x "__pycache__/*" "*.pyc"
          cd ../..
          unzip -l ha-mcp-for-xiaozhi.zip

      - name: Upload ZIP to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${GITHUB_REF#refs/tags/}" ha-mcp-for-xiaozhi.zip --clobber
